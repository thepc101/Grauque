<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grauque Quick Prompt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
    }

    html, body {
      background: transparent !important;
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100vh;
      border: none !important;
      outline: none !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .quick-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: 18px;
      border: none !important;
      outline: none !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-app-region: drag;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(-6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 14px;
      -webkit-app-region: no-drag;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #d96b43, #b24d27);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(217, 107, 67, 0.3);
    }

    input[type="text"] {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 18px;
      color: #1f1e1d;
      font-weight: 450;
      letter-spacing: -0.2px;
    }

    input[type="text"]::placeholder {
      color: #8c8983;
      font-weight: 400;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding-top: 10px;
      font-size: 12px;
      color: #7d7a74;
      -webkit-app-region: no-drag;
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: rgba(2, 132, 199, 0.1);
      color: #0284c7;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
    }

    .shortcuts-hint {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kbd-chip {
      background: rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #4f4c46;
    }

    /* Dark mode adapt */
    @media (prefers-color-scheme: dark) {
      .quick-box {
        background: rgba(24, 24, 27, 0.95);
        border: none !important;
        outline: none !important;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.5);
      }
      input[type="text"] {
        color: #f8fafc;
      }
      input[type="text"]::placeholder {
        color: #64748b;
      }
      .footer-row {
        border-top-color: rgba(255, 255, 255, 0.08);
        color: #94a3b8;
      }
      .kbd-chip {
        background: rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
      }
      .pill-tag {
        background: rgba(2, 132, 199, 0.15);
        color: #38bdf8;
      }
    }
  </style>
</head>
<body>
  <div class="quick-box">
    <div class="input-row">
      <img src="assets/icon.png" width="36" height="36" alt="Grauque" style="border-radius: 8px; filter: drop-shadow(0 4px 10px rgba(2, 132, 199, 0.25)); flex-shrink: 0; display: block;" />
      <input type="text" id="prompt-input" placeholder="Ask Grauque anything..." autofocus spellcheck="false" autocomplete="off" />
    </div>
    <div class="footer-row">
      <span class="pill-tag">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        GPT-OSS 120B
      </span>
      <div class="shortcuts-hint">
        <span>Press <span class="kbd-chip">↵ Enter</span> to ask in Grauque</span>
        <span><span class="kbd-chip">Esc</span> dismiss</span>
      </div>
    </div>
  </div>

  <script src="js/quick-prompt.js"></script>
</body>
</html>
