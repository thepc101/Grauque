<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grauque</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FAF9F5;
      color: #1F1E1D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(217, 107, 67, 0.25);
    }

    h1 {
      font-family: "Iowan Old Style", "Apple Garamond", Georgia, serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1F1E1D;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #6B6862;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #D96B43;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 26px;
      border-radius: 12px;
      transition: background 0.15s ease, transform 0.15s ease;
      box-shadow: 0 4px 14px rgba(217, 107, 67, 0.3);
    }

    .download-btn:hover {
      background: #C15F3C;
      transform: translateY(-1px);
    }

    .meta {
      font-size: 12px;
      color: #9E9B95;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #191918;
        color: #F4F3EE;
      }
      h1 {
        color: #F4F3EE;
      }
      p {
        color: #A3A09A;
      }
      .download-btn {
        background: #E07A52;
      }
      .download-btn:hover {
        background: #D96B43;
      }
      .meta {
        color: #6B6964;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="build/icon.png" alt="Grauque Logo" class="logo">
    <h1>Grauque</h1>
    <p>A fast, Groq-powered AI assistant for macOS. Claude-style conversations, interactive quizzes, and a quick prompt box whenever you double-tap Option.</p>
    <a href="release/Grauque-1.0.0-mac-x64.dmg" download="Grauque-1.0.0-mac-x64.dmg" class="download-btn" id="download-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      <span>Download for Mac (Intel DMG)</span>
    </a>
    <span class="meta">macOS 10.15+ • Intel (x64) • v1.0.0</span>
  </div>
</body>
</html>
